name: Deploy Echo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /echo/
          VITE_ENGINE: transformers
      - name: Check service worker base path
        run: grep -q 'createHandlerBoundToURL("/echo/")' .output/public/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5